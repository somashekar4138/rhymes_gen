[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhymes"
version = "0.1.0"
description = "Turn a nursery rhyme you wrote into a sung audio track, for free, on a borrowed GPU"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "huggingface_hub>=0.26",
]

[project.optional-dependencies]
gpu = [
    "heartlib @ git+https://github.com/HeartMuLa/heartlib",
]

[project.scripts]
rhymes = "rhymes.cli:main"

[tool.hatch.metadata]
# The `gpu` extra points at heartlib's git URL; hatchling refuses a direct
# reference without this.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rhymes"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
